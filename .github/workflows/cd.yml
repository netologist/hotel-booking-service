name: Continuous Deployment (Render)

# Trigger deployments using Render API / Blueprint sync with RENDER_API_KEY secret.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment trigger"
        required: false
        default: "Manual trigger via GitHub Actions"
      run_migrations:
        description: "Run Goose database migrations before deploy"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    # Run migrations if DATABASE_URL secret is provided, or if explicitly requested via inputs
    if: ${{ secrets.DATABASE_URL != '' || inputs.run_migrations == true }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply database migrations with Goose
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is required when run_migrations is true."
            exit 1
          fi
          go tool goose -dir database/migrations postgres "$DATABASE_URL" up

  deploy-render:
    name: Deploy Render Blueprint & Services
    runs-on: ubuntu-latest
    needs: [migrate]
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Render Credentials
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_API_KEY" ] && [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Either RENDER_API_KEY (recommended) or RENDER_DEPLOY_HOOK_URL secret must be set in repository secrets."
            exit 1
          fi

      - name: Deploy via Render API or Deploy Hook
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          REF: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
        run: |
          if [ -n "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY detected. Interacting with Render API..."
            
            # If explicit service ID provided, trigger service deploy directly
            if [ -n "$RENDER_SERVICE_ID" ]; then
              echo "Triggering deploy for service $RENDER_SERVICE_ID..."
              HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" \
                -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
                -H "Authorization: Bearer ${RENDER_API_KEY}" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                -d '{"clearCache": "do_not_clear"}')
              
              if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
                echo "Successfully triggered service deployment (HTTP $HTTP_STATUS)."
                cat response.txt
                exit 0
              else
                echo "::error::Render API service deploy failed with HTTP $HTTP_STATUS:"
                cat response.txt
                exit 1
              fi
            fi

            # Otherwise, sync/trigger via Blueprints API
            echo "Checking blueprint sync for repo: ${REPO_NAME}..."
            SYNC_STATUS=$(curl -s -o blueprints.txt -w "%{http_code}" \
              -X GET "https://api.render.com/v1/blueprints" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json")

            if [ "$SYNC_STATUS" -ge 200 ] && [ "$SYNC_STATUS" -lt 300 ]; then
              # Find blueprint matching repo or first blueprint
              BP_ID=$(jq -r --arg repo "https://github.com/${REPO_NAME}" '.[] | select(.repo == $repo) | .id' blueprints.txt 2>/dev/null || true)
              if [ -z "$BP_ID" ] || [ "$BP_ID" = "null" ]; then
                # Fallback to first blueprint found in account
                BP_ID=$(jq -r '.[0].id // empty' blueprints.txt 2>/dev/null || true)
              fi

              if [ -n "$BP_ID" ] && [ "$BP_ID" != "null" ]; then
                echo "Found blueprint $BP_ID. Triggering sync..."
                TRIGGER_STATUS=$(curl -s -o sync_response.txt -w "%{http_code}" \
                  -X POST "https://api.render.com/v1/blueprints/${BP_ID}/syncs" \
                  -H "Authorization: Bearer ${RENDER_API_KEY}" \
                  -H "Accept: application/json")
                if [ "$TRIGGER_STATUS" -ge 200 ] && [ "$TRIGGER_STATUS" -lt 300 ]; then
                  echo "Successfully triggered blueprint sync (HTTP $TRIGGER_STATUS)."
                  cat sync_response.txt
                  exit 0
                fi
              fi
            fi

            # Fallback: find web service with matching name 'items-api'
            echo "Querying services to find items-api..."
            SERVICES_STATUS=$(curl -s -o services.txt -w "%{http_code}" \
              -X GET "https://api.render.com/v1/services?limit=50" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json")

            if [ "$SERVICES_STATUS" -ge 200 ] && [ "$SERVICES_STATUS" -lt 300 ]; then
              SVC_ID=$(jq -r '.[] | select(.service.name == "items-api") | .service.id' services.txt 2>/dev/null || true)
              if [ -n "$SVC_ID" ] && [ "$SVC_ID" != "null" ]; then
                echo "Found items-api service ID: $SVC_ID. Triggering deploy..."
                HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" \
                  -X POST "https://api.render.com/v1/services/${SVC_ID}/deploys" \
                  -H "Authorization: Bearer ${RENDER_API_KEY}" \
                  -H "Accept: application/json" \
                  -H "Content-Type: application/json" \
                  -d '{"clearCache": "do_not_clear"}')
                if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
                  echo "Successfully triggered deployment for items-api (HTTP $HTTP_STATUS)."
                  cat response.txt
                  exit 0
                else
                  echo "::error::Deploy trigger failed with HTTP $HTTP_STATUS:"
                  cat response.txt
                  exit 1
                fi
              fi
            fi

            echo "::error::Could not automatically locate blueprint or items-api service. Please set RENDER_SERVICE_ID in GitHub secrets or use RENDER_DEPLOY_HOOK_URL."
            exit 1

          elif [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering deploy via RENDER_DEPLOY_HOOK_URL..."
            HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${REF}")
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "Successfully triggered Render deployment via Deploy Hook (HTTP $HTTP_STATUS)."
              cat response.txt
            else
              echo "::error::Render deploy hook failed with HTTP $HTTP_STATUS:"
              cat response.txt
              exit 1
            fi
          fi
