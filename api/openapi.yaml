openapi: 3.0.3
info:
  title: Hotel Booking Platform API
  description: Clean Architecture REST API for hotel management.
  version: 1.0.0
paths:
  /healthz:
    get:
      summary: Health check probe
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/hotels:
    get:
      summary: Find hotels by name (case-insensitive, partial match)
      operationId: findHotels
      parameters:
        - { name: name, in: query, required: true, schema: { type: string }, example: grand }
      responses:
        "200":
          description: Matching hotels (possibly empty)
          content:
            application/json:
              schema:
                type: object
                properties:
                  hotels:
                    type: array
                    items: { $ref: "#/components/schemas/Hotel" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      summary: Register a new hotel
      operationId: createHotel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHotelRequest'
      responses:
        '201':
          description: Hotel registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hotel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/seed:
    post:
      summary: Seed database with test data
      operationId: seedDatabase
      responses:
        '200':
          description: Database seeded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/reset:
    post:
      summary: Reset database removing all test data
      operationId: resetDatabase
      responses:
        '200':
          description: Database reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    BadRequest:
      description: Bad Request - Validation error or malformed request body
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict - Resource already exists or invariant conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    ValidationError:
      type: object
      required:
        - name
        - reason
      properties:
        name:
          type: string
          description: Name of the invalid field or parameter
          example: "name"
        reason:
          type: string
          description: Reason why the field is invalid
          example: "must be at least 2 characters long"

    Problem:
      type: object
      description: RFC 9457 Problem Details object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type
          example: "about:blank"
        title:
          type: string
          description: Short, human-readable summary of the problem type
          example: "Bad Request"
        status:
          type: integer
          description: The HTTP status code generated by the origin server
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence of the problem
          example: "name length must be between 2 and 255 characters"
        instance:
          type: string
          format: uri-reference
          description: A URI reference that identifies the specific occurrence of the problem
          example: "/api/v1/hotels"
        code:
          type: string
          description: Application-specific error code
          example: "INVALID_HOTEL"
        request_id:
          type: string
          description: Identifier of the request; quote it when reporting a server error so it can be found in the server logs
          example: "7f3c1e2a-4b5d-4c6e-8f90-a1b2c3d4e5f6"
        errors:
          type: array
          description: List of invalid fields for validation problems
          items:
            $ref: '#/components/schemas/ValidationError'
    RoomType:
      type: string
      enum:
        - single
        - double
        - deluxe
      example: single

    Room:
      type: object
      required:
        - id
        - hotel_id
        - room_number
        - room_type
        - capacity
      properties:
        id:
          type: string
          format: uuid
        hotel_id:
          type: string
          format: uuid
        room_number:
          type: string
          example: "101"
        room_type:
          $ref: '#/components/schemas/RoomType'
        capacity:
          type: integer
          example: 1

    Hotel:
      type: object
      required:
        - id
        - name
        - address
        - city
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Grand Budapest Hotel"
        address:
          type: string
          example: "100 Alpine Way"
        city:
          type: string
          example: "Lutz"
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/Room'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateHotelRequest:
      type: object
      required:
        - name
        - address
        - city
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
          example: "Grand Budapest Hotel"
        address:
          type: string
          minLength: 2
          maxLength: 255
          example: "100 Alpine Way"
        city:
          type: string
          minLength: 2
          maxLength: 100
          example: "Lutz"

    SeedResponse:
      type: object
      required:
        - message
        - hotels_count
        - rooms_count
      properties:
        message:
          type: string
          example: "Database seeded successfully"
        hotels_count:
          type: integer
          example: 2
        rooms_count:
          type: integer
          example: 12

    ResetResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Database reset successfully"
